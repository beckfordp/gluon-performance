name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      # No GitHub Packages token: this harness depends on nothing published from
      # beckfordp/purerest, so the built-in GITHUB_TOKEN isn't needed for resolution.
      - name: scalafmtCheck + test + Gatling/compile
        run: sbt scalafmtCheck Test/scalafmtCheck test Gatling/compile
